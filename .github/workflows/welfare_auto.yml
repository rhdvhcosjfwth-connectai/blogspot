name: Welfare Information Blogspot Auto Publisher

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["블로그스팟 자동 글쓰기 봇"]
    types:
      - completed

jobs:
  post_to_blogspot:
    # Continue after Bot 1 completes, whether it succeeds or fails.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-generativeai requests beautifulsoup4 pillow

      - name: Create and schedule welfare posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_URL: ${{ secrets.BLOG_URL_2 }}
          TOKEN_JSON_BASE64: ${{ secrets.TOKEN_JSON_BASE64_2 }}
          CREDENTIALS_JSON_BASE64: ${{ secrets.CREDENTIALS_JSON_BASE64_2 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ASSET_REPO: b847994-a11y/blog-assets
          ASSET_GITHUB_TOKEN: ${{ secrets.ASSET_GITHUB_TOKEN }}
          BLOG_IMAGE_NAMESPACE: welfare
          POSTS_PER_RUN: 7
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python welfare_bot.py

      - name: Commit generated images
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p images
          touch images/.gitkeep
          git add images/ gg24_published_titles.json
          git commit -m "Save generated images and gg24 publish history [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed, skipping"

      - name: Trigger Bot 3 (Libme Bot) on Repository B
        # Continue the publishing chain even when this bot fails.
        if: always()
        run: |
          curl --fail-with-body --show-error --silent -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/b847994-a11y/blogspot/dispatches \
            -d '{"event_type":"trigger_libme_bot"}'
