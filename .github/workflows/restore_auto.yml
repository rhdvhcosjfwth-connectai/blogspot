name: 블로그스팟 옛날 글 이미지 복구 봇

on:
  workflow_dispatch:   # 수동 실행 전용

jobs:
  restore_images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 코드 가져오기
        uses: actions/checkout@v3

      - name: 🐍 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 필요한 패키지 설치
        run: pip install google-api-python-client google-auth requests

      - name: 🚀 옛날 글 이미지 복구 스크립트 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_JSON_BASE64: ${{ secrets.TOKEN_JSON_BASE64 }}
        run: python restore_images.py

      - name: ⚙️ 생성된 이미지 깃허브에 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p images
          touch images/.gitkeep
          git add images/
          git commit -m "Add restored images for old blog posts [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed, skipping"
